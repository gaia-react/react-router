# Fixture for W13 (SPEC-078 lever one). dorny/paths-filter casts an
# unrecognized change-status token without validating it, so an entry keyed
# on `changed` -- outside both the action's accepted set and this
# repository's own allowlist for wiki/.state.json -- parses cleanly and
# matches nothing forever. That silent failure is exactly what W13 exists to
# catch, so this fixture is committed rather than doctored: a doctored-only
# case would let the guard's own green be indistinguishable from the bug it
# is supposed to catch.
#
# Minimal rather than a copy of the real workflow, so it cannot go stale.
jobs:
  shards:
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            code:
              - changed: 'wiki/.state.json'
